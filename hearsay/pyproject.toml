# Author: Alex Picon <alexnpc@me.com>
[project]
name = "hearsay"
version = "0.1.0"
description = "HEARSAY: explainable synthetic-speech detection for the NSA HackGT 13 challenge"
authors = [{ name = "Alex Picon", email = "alexnpc@me.com" }]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "joblib>=1.4",
    "librosa>=1.0.0",
    "lightgbm>=4.6",
    "matplotlib>=3.11.2",
    "numpy>=2.2",
    "pandas>=2.2",
    "pyarrow>=25.0.1",
    "scikit-learn>=1.6",
    "scipy>=1.15",
    "soundfile>=0.13",
    "torch>=2.9",
    "transformers>=4.57",
]

[project.scripts]
hearsay = "hearsay.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hearsay", "forensics"]

[tool.hatch.build.targets.wheel.force-include]
"models/detector.joblib" = "hearsay/assets/detector.joblib"

[tool.hatch.build.targets.sdist]
include = ["hearsay/", "forensics/", "models/detector.joblib", "tests/", "README.md", "pyproject.toml", "uv.lock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D"]
ignore = ["D203", "D213"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]
